[package]
name = "whatchamacallit"
version = "0.1.0"
edition = "2024"

[dependencies]
ndarray = "0.17.2"
ort = {version = "2.0.0-rc.15", features = ["ndarray"] }
quick-xml = "0.42.0"
regex = "1.12.4"
rusqlite = {version = "0.41.0", features = ["bundled"]}
serde = "1.0.229"
serde_json = "1.0.154"
sqlite-vec = "0.1.9"
thiserror = "1"
tokenizers = "0.23.2"
tokio = "1.54.1"
zerocopy = "0.8.63"

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
