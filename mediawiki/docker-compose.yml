services:
  db:
    image: mariadb:11
    command: ["--innodb-buffer-pool-size=4G"]
    environment:
      MARIADB_DATABASE: wiki
      MARIADB_USER: wiki
      MARIADB_PASSWORD: wiki
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql

  mediawiki:
    build: .
    depends_on:
      - db
    ports:
      - "127.0.0.1:8080:80"
    environment:
      MW_CONFIG_FILE: /config/LocalSettings.php
    volumes:
      - ./config:/config
      - ./php-tuning.ini:/usr/local/etc/php/conf.d/zz-tuning.ini:ro
      - ../dictionary:/dump:ro

volumes:
  dbdata:
